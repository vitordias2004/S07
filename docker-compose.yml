version: '3.8'
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-s07
    user: "1000:1000"
    group_add:
      - "0"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx/html/data:/shared/nginx-data
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - devops-network
    restart: unless-stopped

  cypress:
    image: vitordias2004/s07-devops:latest
    container_name: cypress-s07
    depends_on:
      - nginx
      - node-app
    environment:
      - CYPRESS_baseUrl=http://nginx:80
      - NODE_APP_URL=http://node-app:3000
    networks:
      - devops-network
    volumes:
      - cypress-videos:/app/cypress/videos
      - cypress-screenshots:/app/cypress/screenshots
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-s07
    ports:
      - "80:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  node-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: node-app-s07
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - devops-network
    volumes:
      - test-results:/data  
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  devops-network:
    driver: bridge

volumes:
  jenkins-home:
  cypress-videos:
  cypress-screenshots:
  test-results:
